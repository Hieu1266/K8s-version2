metadata:
  name: app-db-secrets
type: Opaque
stringData:
  COURSES_DB_URL: "postgresql+psycopg2://postgres:B2305573@postgres:5432/course_db"
  USERS_DB_URL: "postgresql+psycopg2://postgres:B2305573@postgres:5432/user_db"
  QUIZS_DB_URL: "postgresql+psycopg2://postgres:B2305573@postgres:5432/quiz_exam_db"
