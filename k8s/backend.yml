# ==========================================
# 1. USER SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: thanhieub2305573/user-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: CLIENT_ID
          value: "373059704505-idbcgjtvf3pl94krkoeh67f4ars8fmte.apps.googleusercontent.com"
        - name: CLIENT_SECRET_KEY
          value: "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"
        - name: USERS_DB_URL
          value: "postgresql://postgres:abc123@postgres:5432/user_db"
        - name: FRONTEND_HOST
          value: "http://localhost:30080"
        - name: STORAGE_API_URL
          value: "http://storage-service:8000"
        - name: BACKEND_USER_URL
          value: "http://user-service:8000"
        - name: BACKEND_COURSE_URL
          value: "http://course-service:8001"
        - name: BACKEND_QUIZ_EXAM_URL
          value: "http://quiz-exam-service:8002"
        - name: BACKEND_LEARNING_PROGRESS_URL
          value: "http://learning-progress-service:8003"
        envFrom:
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: user-service

---
