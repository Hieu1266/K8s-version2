name: Build and Deploy to K8s

on:
  push:
    branches:
      - main
    paths:
      - 'backend/service/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/**'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # ==========================================
  # JOB 1: Build & Push 5 Backend Services
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - course_service
          - learning_progress_service
          - quiz_exam_service
          - user_service
          - config_service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/service/${{ matrix.service }}
          file: ./backend/service/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Build & Push Next.js Frontend
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_FRONTEND=${{ secrets.NEXT_PUBLIC_FRONTEND }}
            NEXT_PUBLIC_USER_BACKEND_URL=${{ secrets.NEXT_PUBLIC_USER_BACKEND_URL }}
            NEXT_PUBLIC_COURSE_BACKEND_URL=${{ secrets.NEXT_PUBLIC_COURSE_BACKEND_URL }}
            NEXT_PUBLIC_EXAM_BACKEND_URL=${{ secrets.NEXT_PUBLIC_EXAM_BACKEND_URL }}
            NEXT_PUBLIC_PROGRESS_BACKEND_URL=${{ secrets.NEXT_PUBLIC_PROGRESS_BACKEND_URL }}

  # ==========================================
  # JOB 3: Deploy len Kubernetes Cluster (Local)
  # ==========================================
  deploy-k8s:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Thay the __DOCKER_USERNAME__ bang registry that trong manifest
        shell: powershell
        run: |
          (Get-Content k8s/backend.yml)  -replace '__DOCKER_USERNAME__', "$env:DOCKER_USERNAME" | Set-Content k8s/backend.yml
          (Get-Content k8s/frontend.yml) -replace '__DOCKER_USERNAME__', "$env:DOCKER_USERNAME" | Set-Content k8s/frontend.yml

      - name: Deploy Manifests
        shell: powershell
        run: |
          kubectl apply -f k8s/postgres.yml
          kubectl apply -f k8s/backend-secrets.yml
          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/frontend.yml

          kubectl rollout status deployment/postgres --timeout=120s

          kubectl rollout restart deployment/course-service
          kubectl rollout restart deployment/learning-progress-service
          kubectl rollout restart deployment/quiz-exam-service
          kubectl rollout restart deployment/user-service
          kubectl rollout restart deployment/config-service
          kubectl rollout restart deployment/frontend

      - name: Expose NodePort ra LAN (netsh portproxy)
        shell: powershell
        run: |
          $lanIp = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object {
            $_.InterfaceAlias -notmatch 'Loopback|vEthernet|WSL' -and $_.IPAddress -notlike '169.254.*'
          } | Select-Object -First 1 -ExpandProperty IPAddress)

          Write-Host "LAN IP hien tai: $lanIp"

          $ports = 30080,30800,30801,30802,30803
          foreach ($port in $ports) {
            netsh interface portproxy delete v4tov4 listenport=$port listenaddress=$lanIp | Out-Null
            netsh interface portproxy add v4tov4 listenaddress=$lanIp listenport=$port connectaddress=127.0.0.1 connectport=$port
          }

          netsh interface portproxy show v4tov4

          if (-not (Get-NetFirewallRule -DisplayName "LUMER K8s Ports" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -DisplayName "LUMER K8s Ports" -Direction Inbound -LocalPort $ports -Protocol TCP -Action Allow
          }